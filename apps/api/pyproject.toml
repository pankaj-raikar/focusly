[project]
name = "focusly-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "fastapi>=0.135,<1",
  "kokoro>=0.9.4,<1",
  "manim>=0.20.1",
  "misaki[en]>=0.9.4,<1",
  "numpy>=2,<3",
  "openai>=2.0,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "soundfile>=0.13,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
  "httpx2>=2.4,<3",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
